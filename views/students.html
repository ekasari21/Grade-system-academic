<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Mahasiswa — Student Grade Calculator</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>📊 GradeCalc</h2>
      </div>
      <ul class="sidebar-menu">
        <li><a href="/"><span>🏠</span> Dashboard</a></li>
        <li><a href="/students" class="active"><span>👨‍🎓</span> Data Mahasiswa</a></li>
        <li><a href="/courses"><span>📚</span> Data Mata Kuliah</a></li>
        <li><a href="/grades"><span>📝</span> Hasil & Input Nilai</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="user-profile">
          <span id="sidebarUserName" class="user-name">Memuat...</span>
          <span id="sidebarUserRole" class="user-role">-</span>
        </div>
        <button class="btn-logout" onclick="handleLogout()">🚪 Keluar</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-bar">
        <h1>Data Mahasiswa</h1>
        <button id="btnOpenAddStudent" class="btn btn-primary dosen-admin-only">➕ Tambah Mahasiswa</button>
      </header>

      <div class="content-body">
        <div id="studentAlert" class="alert"></div>

        <div class="card">
          <!-- Filter Bar -->
          <div class="filter-bar">
            <input type="text" id="searchStudent" class="form-control search-input" placeholder="🔍 Cari berdasarkan nama atau NIM...">
          </div>

          <!-- Tabel Data Mahasiswa -->
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th style="width: 60px;">No</th>
                  <th>NIM</th>
                  <th>Nama Lengkap</th>
                  <th>Jurusan</th>
                  <th class="dosen-admin-only" style="width: 140px;">Aksi</th>
                </tr>
              </thead>
              <tbody id="studentTableBody">
                <tr>
                  <td colspan="5" style="text-align: center; color: var(--text-muted);">Memuat data mahasiswa...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Tambah / Edit Mahasiswa -->
  <div id="studentModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="studentModalTitle">Tambah Mahasiswa Baru</h3>
        <button class="btn-close btn-close-modal">&times;</button>
      </div>
      <form id="studentForm">
        <input type="hidden" id="studentId">
        <div class="form-group">
          <label for="inputNIM">NIM (Nomor Induk Mahasiswa)</label>
          <input type="text" id="inputNIM" class="form-control" placeholder="202601001" required>
        </div>
        <div class="form-group">
          <label for="inputName">Nama Lengkap</label>
          <input type="text" id="inputName" class="form-control" placeholder="Budi Santoso" required>
        </div>
        <div class="form-group">
          <label for="inputMajor">Jurusan / Program Studi</label>
          <input type="text" id="inputMajor" class="form-control" placeholder="Teknik Informatika" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-close-modal">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/students.js"></script>
</body>
</html>
