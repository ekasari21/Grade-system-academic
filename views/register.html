<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun — Student Grade Calculator</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Buat Akun Baru</h1>
        <p>Lengkapi data untuk mendaftar sistem</p>
      </div>

      <div id="authAlert" class="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="registerName">Nama Lengkap</label>
          <input type="text" id="registerName" class="form-control" placeholder="Budi Santoso" required>
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" class="form-control" placeholder="nama@kampus.ac.id" required>
        </div>

        <div class="form-group">
          <label for="registerPassword">Kata Sandi (min. 6 karakter)</label>
          <input type="password" id="registerPassword" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="registerRole">Peran (Role)</label>
          <select id="registerRole" class="form-control">
            <option value="mahasiswa" selected>Mahasiswa</option>
            <option value="dosen">Dosen</option>
          </select>
        </div>

        <div id="studentFields">
          <div class="form-group">
            <label for="registerNIM">NIM (Nomor Induk Mahasiswa)</label>
            <input type="text" id="registerNIM" class="form-control" placeholder="Contoh: 202601001" required>
          </div>

          <div class="form-group">
            <label for="registerMajor">Jurusan / Program Studi</label>
            <input type="text" id="registerMajor" class="form-control" placeholder="Teknik Informatika">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Daftar Akun</button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Sudah memiliki akun? <a href="/login" style="color: var(--primary); font-weight: 600; text-decoration: none;">Masuk di sini</a>
      </div>
    </div>
  </div>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
